<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signing you in</title>
<style>
  body { font-family: sans-serif; text-align: center; margin-top: 80px; }
  button.btn {
    display: inline-block; padding: 16px 32px; font-size: 18px;
    background: #E56B1F; color: white; border: none; border-radius: 8px;
    margin-top: 20px;
  }
  #debug { margin-top: 30px; font-size: 12px; color: #888; word-break: break-all; padding: 0 20px; }
</style>
</head>
<body>
<p>Sign-in successful.</p>
<button class="btn" onclick="goToApp()">Tap to return to app</button>
<div id="debug"></div>
<script>
  var params = window.location.search + window.location.hash;
  var target = "app.vercel.radharadharadha.capacitor://oauthredirect" + params;
  document.getElementById("debug").textContent = target;
  function goToApp() {
    window.location.href = target;
  }
  setTimeout(goToApp, 400);
</script>
</body>
</html>
